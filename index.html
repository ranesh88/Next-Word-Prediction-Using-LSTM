<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Word Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <h1>Next Word Prediction With LSTM And Early Stopping</h1>
    <form method="POST">
        <input type="text" name="input_text" placeholder="Enter the sequence of Words" required>
        <button type="submit">Predict Next Word</button>
    </form>
    {% if prediction %}
    <div class="result">
        <strong>Next Word:</strong> {{ prediction }}
    </div>
    {% endif %}
</body>
</html>
